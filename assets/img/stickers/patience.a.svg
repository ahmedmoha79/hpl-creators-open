<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>@keyframes w{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}.m{transform-origin:100px 150px;animation:w 1.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}.spark{transform-box:fill-box;transform-origin:center;animation:tw 1.3s ease-in-out infinite}.spark:nth-of-type(2n){animation-delay:.45s}@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><g><path d="M58 34 H142 V48 Q142 86 108 100 Q142 114 142 152 V166 H58 V152 Q58 114 92 100 Q58 86 58 48 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round" style="filter:drop-shadow(0 3px 4px rgba(30,20,15,.28))"/><path d="M58 34 H142 V48 Q142 86 108 100 Q142 114 142 152 V166 H58 V152 Q58 114 92 100 Q58 86 58 48 Z" fill="#f1f5f9" stroke="#1e140f" stroke-width="6" stroke-linejoin="round" /></g><path d="M76 150 Q100 128 124 150 Z" fill="#f2b632" stroke="#1e140f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 60 H120 Q114 82 100 88 Q86 82 80 60 Z" fill="#f2b632" stroke="#1e140f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-2 100 180)"><text x="100" y="180" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="28" fill="#fff" stroke="#fff" stroke-width="8.4" stroke-linejoin="round" style="filter:drop-shadow(0 3px 3px rgba(30,20,15,.3))">WAIT...</text><text x="100" y="180" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="28" fill="#fff" stroke="#1e140f