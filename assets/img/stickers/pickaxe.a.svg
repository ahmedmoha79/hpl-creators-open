<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>@keyframes w{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}.m{transform-origin:100px 150px;animation:w 1.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}.spark{transform-box:fill-box;transform-origin:center;animation:tw 1.3s ease-in-out infinite}.spark:nth-of-type(2n){animation-delay:.45s}@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><g><path d="M96 70 L112 74 L82 170 L66 166 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round" style="filter:drop-shadow(0 3px 4px rgba(30,20,15,.28))"/><path d="M96 70 L112 74 L82 170 L66 166 Z" fill="#a0673a" stroke="#1e140f" stroke-width="6" stroke-linejoin="round" /></g><g><path d="M36 72 Q100 26 166 70 Q138 60 104 62 Q70 60 36 72 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round" style="filter:drop-shadow(0 3px 4px rgba(30,20,15,.28))"/><path d="M36 72 Q100 26 166 70 Q138 60 104 62 Q70 60 36 72 Z" fill="#8b97a5" stroke="#1e140f" stroke-width="6" stroke-linejoin="round" /></g><g transform="rotate(-10 140 150)"><text x="140" y="150" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="30" fill="#fff" stroke="#fff" stroke-width="9.0" stroke-linejoin="round" style="filter:drop-shadow(0 3px 3px rgba(30,20,15,.3))">DIG!</text><text x="140" y="150" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="30" fill="#f2b632" stroke="#1e140f" stroke-width="3.9" stroke-linejoin="round" paint-order="stroke">DIG!