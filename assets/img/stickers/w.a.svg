<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><style>@keyframes p{0%,100%{transform:scale(1)}40%{transform:scale(1.09)}60%{transform:scale(.97)}}.m{transform-origin:100px 100px;animation:p 1.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.55)}}.spark{transform-box:fill-box;transform-origin:center;animation:tw 1.3s ease-in-out infinite}.spark:nth-of-type(2n){animation-delay:.45s}@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m"><g transform="rotate(-8 100 100)"><text x="100" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="110" fill="#fff" stroke="#fff" stroke-width="33.0" stroke-linejoin="round" style="filter:drop-shadow(0 3px 3px rgba(30,20,15,.3))">W</text><text x="100" y="100" text-anchor="middle" dominant-baseline="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="110" fill="#22c55e" stroke="#1e140f" stroke-width="14.3" stroke-linejoin="round" paint-order="stroke">W</text></g></g></svg>